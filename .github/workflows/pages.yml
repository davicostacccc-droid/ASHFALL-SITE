name: ASHFALL Site — Validar e publicar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Validar conteúdo público
        run: python3 scripts/validate_content.py
      - name: Conferir estados editoriais e links
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Conferir JavaScript e filtros
        run: |
          node --check site/app.js
          node --check site/content-model.mjs
          node scripts/content-model.test.mjs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar somente arquivos do site
        run: |
          mkdir -p _public
          cp -R site/. _public/
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verificar endereço público e arquivos
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time
          from urllib.request import urlopen
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          paths = ['index.html', 'styles.css', 'app.js', 'content-model.mjs', 'data/content.json', 'assets/sigil.svg', 'assets/terras-das-cinzas.webp', 'assets/a-queda.webp', 'assets/ascendentes.webp', 'assets/cacador-gotico.webp']
          with open('site/data/content.json', encoding='utf-8') as source:
              content = json.load(source)
          paths += [media['src'] for update in content['updates'] for media in update.get('media', [])]
          for attempt in range(6):
              try:
                  for path in paths:
                      with urlopen(base + path, timeout=20) as response:
                          body = response.read()
                          assert response.status == 200 and body, path
                          if path == 'index.html':
                              assert b'ASHFALL' in body, 'Página inesperada'
                          if path.endswith('.json'):
                              data = json.loads(body)
                              assert data['schemaVersion'] == 1
                              assert len(data['origins']) == 5
                              assert data['game']['asOf']
                              assert data['roadmap']
                          print('OK HTTP 200:', base + path)
                  print('PUBLIC_SITE_VERIFIED:', base)
                  break
              except Exception as exc:
                  if attempt == 5:
                      raise
                  print('Aguardando atualização do Pages:', exc)
                  time.sleep(10)
          PY
