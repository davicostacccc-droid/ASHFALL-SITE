name: ASHFALL Site — Validar e publicar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Validar conteúdo público
        run: python3 scripts/validate_content.py
      - name: Conferir estados editoriais e links
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Conferir JavaScript e filtros
        run: |
          node --check site/app.js
          node --check site/content-model.mjs
          node --check site/previa-sonora.js
          node scripts/content-model.test.mjs
          node scripts/audio-player.test.mjs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar somente arquivos do site
        run: |
          python3 scripts/build_public.py
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verificar endereço público e arquivos
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time
          from urllib.request import urlopen
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          paths = ['index.html', 'styles.css', 'app.js', 'content-model.mjs', 'data/content.json', 'assets/sigil.svg', 'assets/terras-das-cinzas.webp', 'assets/a-queda.webp', 'assets/ascendentes.webp', 'assets/cacador-gotico.webp']
          with open('_public/asset-manifest.json', encoding='utf-8') as manifest_file:
              manifest = json.load(manifest_file)
          paths += list(manifest.values())
          preview_paths = ['previa-sonora.html', 'previa-sonora.css', 'assets/audio/terras-das-cinzas-estudo-01.mp3']
          paths += preview_paths
          with open('site/data/content.json', encoding='utf-8') as source:
              content = json.load(source)
          paths += [media['src'] for update in content['updates'] for media in update.get('media', [])]
          for attempt in range(6):
              try:
                  for path in paths:
                      with urlopen(base + path, timeout=20) as response:
                          body = response.read()
                          assert response.status == 200 and body, path
                          if path in preview_paths:
                              from pathlib import Path
                              assert body == (Path('_public') / path).read_bytes(), 'Prévia publicada difere do pacote: ' + path
                          if path.endswith('.mp3'):
                              media_type = response.headers.get_content_type()
                              print('Tipo de áudio informado pela hospedagem:', media_type)
                              # O player declara audio/mpeg; Pages também pode servir MP3 como binário.
                              assert media_type.startswith('audio/') or media_type == 'application/octet-stream', 'Tipo de áudio inesperado: ' + media_type
                              assert body.startswith(b'ID3') or body[:2] in (b'\xff\xfb', b'\xff\xfa'), 'Cabeçalho MP3 inválido'
                          if path == 'index.html':
                              assert b'ASHFALL' in body, 'Página inesperada'
                              assert manifest['app.js'].encode() in body, 'HTML de versão anterior'
                              assert manifest['styles.css'].encode() in body, 'CSS de versão anterior'
                          if path.endswith('.json'):
                              data = json.loads(body)
                              assert data['schemaVersion'] == 1
                              assert len(data['origins']) == 5
                              assert data['game']['asOf']
                              assert data['roadmap']
                          print('OK HTTP 200:', base + path)
                  print('PUBLIC_SITE_VERIFIED:', base)
                  break
              except Exception as exc:
                  if attempt == 5:
                      raise
                  print('Aguardando atualização do Pages:', exc)
                  time.sleep(10)
          PY
